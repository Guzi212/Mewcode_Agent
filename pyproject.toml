[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mewcode"
description = "Claude Code 风格的终端 AI 对话助手"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "textual>=0.60",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
mewcode = "mewcode.cli:main"

[tool.setuptools.packages.find]
include = ["mewcode*"]

[tool.setuptools.dynamic]
version = { attr = "mewcode.__version__" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
